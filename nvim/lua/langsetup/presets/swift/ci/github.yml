# GitHub Actions on Linux: build and test with the Swift image the project's tools version names
# target: .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:{{swift}}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
