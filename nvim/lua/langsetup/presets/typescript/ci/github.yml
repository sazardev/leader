# GitHub Actions: install with the project's package manager, lint, typecheck, test, build
# target: .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "{{node}}"
      - run: corepack enable
      - run: {{install}}
      - run: {{run}} lint --if-present
      - run: {{exec}} tsc --noEmit
      - run: {{run}} test --if-present
      - run: {{run}} build --if-present
