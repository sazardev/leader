# GitHub Actions: Gradle check (build, test, ktlint)
# target: .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "{{jvm}}"
          cache: gradle
      - run: ./gradlew --no-daemon check
