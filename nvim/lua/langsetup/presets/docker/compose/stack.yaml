# Compose stack for {{name}}: app + database with a named volume
# target: compose.yaml
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:changeme@db:5432/{{name}}_dev
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "{{name}}_dev"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
