# Compose for the database of {{name}} ({{dialect}})
# target: compose.yaml
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "{{name}}_dev"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
