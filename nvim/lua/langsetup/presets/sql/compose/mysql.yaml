# Compose for the database of {{name}} (MySQL 8.4)
# target: compose.yaml
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "{{name}}_dev"
      MYSQL_USER: app
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: changeme-root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "app", "-pchangeme"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
