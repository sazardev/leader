# GitHub Actions: install, lint, build (Astro)
# target: .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "{{node}}"
      - run: corepack enable
      - run: {{install}}
      - run: {{run}} build
