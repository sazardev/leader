# golangci-lint v2, minimal: the standard linters (errcheck, govet, staticcheck, unused, ineffassign) + gofumpt and goimports
# target: .golangci.yml
version: "2"

run:
  timeout: 5m

linters:
  default: standard

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - {{module}}
