# Air, basic: rebuild and restart on every .go change
# target: .air.toml
root = "."
tmp_dir = "tmp"

[build]
  # builds the binary into tmp/ and runs it
  cmd = "go build -o ./tmp/{{binary}} {{main}}"
  bin = "./tmp/{{binary}}"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "vendor", "node_modules", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
