<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leader — banner</title>
<style>
@font-face{font-family:Geist;src:url(../fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url(../fonts/GeistMono-Variable.woff2) format("woff2");font-weight:100 900;font-display:block}
:root{--bg:#282828;--deep:#202020;--soft:#323232;--fg:#ebdbb2;--dim:#a89984;--faint:#665c54;--green:#b8bb26;--yellow:#fabd2f;--aqua:#8ec07c;--blue:#83a598;--purple:#d3869b;--red:#fb4934;--orange:#fe8019;--on:#1d2021}
*{box-sizing:border-box;margin:0;padding:0;border:0;border-radius:0}
html,body{width:1600px;height:400px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{position:relative;display:flex;align-items:center}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(235,219,178,.14) 1.1px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 62%,#000);mask-image:linear-gradient(90deg,transparent 20%,#000 62%,#000)}
.left{position:relative;z-index:2;width:790px;padding:0 0 0 72px}
.brand{display:flex;align-items:center;gap:14px;font-size:25px;font-weight:600;letter-spacing:-.025em}
.brand i{width:18px;height:18px;background:var(--green);display:block}
h1{margin-top:44px;font-size:84px;line-height:.92;letter-spacing:-.055em;font-weight:600}
h1 span{display:block}
h1 .g{color:var(--green)}
p{margin-top:26px;font-size:23px;line-height:1.35;color:var(--dim);max-width:640px;font-weight:400}
p b{color:var(--fg);font-weight:500}
.pills{display:flex;gap:10px;margin-top:28px;font-family:"Geist Mono",monospace;font-size:15px}
.pills span{padding:7px 12px;background:var(--soft);color:var(--dim)}
.pills span:first-child{background:var(--green);color:var(--on);font-weight:600}
.url{position:absolute;right:64px;bottom:32px;font-family:"Geist Mono",monospace;font-size:16px;color:var(--faint);letter-spacing:.02em;z-index:2}
.editor{position:relative;z-index:2;width:640px;height:300px;margin-left:auto;margin-right:64px;background:var(--soft);padding:10px}
.win{width:100%;height:100%;background:var(--deep);display:flex;flex-direction:column;font-family:"Geist Mono",monospace;font-size:13px;color:var(--dim)}
.bar{height:30px;display:flex;align-items:center;gap:7px;padding:0 11px;background:var(--soft)}
.bar i{width:7px;height:7px;background:var(--faint);display:block}
.bar i:nth-child(1){background:var(--red)}.bar i:nth-child(2){background:var(--yellow)}.bar i:nth-child(3){background:var(--green)}
.bar em{font-style:normal;margin-left:8px;color:var(--faint);font-size:11px}
.code{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:11px;position:relative}
.ln{display:flex;gap:16px;align-items:center;height:14px}
.ln u{width:18px;text-decoration:none;text-align:right;color:var(--faint);font-size:11px;line-height:1}
.ln b{height:9px;display:block;font-weight:400}
.g1{background:var(--purple);width:64px}.g2{background:var(--blue);width:110px}.g3{background:var(--yellow);width:88px}
.g4{background:var(--aqua);width:150px}.g5{background:var(--green);width:96px}.g6{background:var(--fg);width:130px;opacity:.45}
.g7{background:var(--orange);width:72px}.g8{background:var(--red);width:46px}
.sel{position:absolute;left:16px;right:16px;top:170px;height:22px;background:rgba(131,165,152,.16);border-left:2px solid var(--blue)}
.cursor{position:absolute;left:322px;top:173px;width:8px;height:16px;background:var(--blue)}
.st{height:28px;display:flex;align-items:center;font-size:11px;background:var(--soft);color:var(--faint)}
.st b{background:var(--green);color:var(--on);padding:4px 10px;font-weight:600;margin-right:10px}
.st span{margin-right:14px}.st em{margin-left:auto;margin-right:10px;font-style:normal;color:var(--green)}
</style>
</head>
<body>
<div class="dots"></div>
<div class="left">
  <div class="brand"><i></i>Leader</div>
  <h1><span>Neovim,</span><span class="g">for working.</span></h1>
  <p><b>Fast. Minimal. Opinionated.</b> A config and a GPU window for people who live in the editor.</p>
  <div class="pills"><span>~20 ms</span><span>GPU window</span><span>AI agent</span><span>MIT</span></div>
</div>
<div class="editor">
  <div class="win">
    <div class="bar"><i></i><i></i><i></i><em>leader — ~/projects/leader</em></div>
    <div class="code">
      <div class="ln"><u>1</u><b class="g1"></b><b class="g2"></b></div>
      <div class="ln"><u>2</u><b class="g3"></b><b class="g4"></b></div>
      <div class="ln"><u>3</u><b class="g5"></b></div>
      <div class="ln"><u>4</u><b class="g6"></b><b class="g7"></b></div>
      <div class="ln"><u>5</u><b class="g8"></b><b class="g4"></b></div>
      <div class="ln"><u>6</u><b class="g2"></b><b class="g1"></b></div>
      <div class="sel"></div><div class="cursor"></div>
    </div>
    <div class="st"><b>NORMAL</b><span>lua</span><span>leader</span><em>main</em></div>
  </div>
</div>
<div class="url">leader.sazardev.stream</div>
</body>
</html>
