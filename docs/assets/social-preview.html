<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leader — social preview</title>
<style>
@font-face{font-family:Geist;src:url(../fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url(../fonts/GeistMono-Variable.woff2) format("woff2");font-weight:100 900;font-display:block}
:root{--bg:#282828;--deep:#202020;--soft:#323232;--fg:#ebdbb2;--dim:#a89984;--faint:#665c54;--green:#b8bb26;--yellow:#fabd2f;--aqua:#8ec07c;--blue:#83a598;--on:#1d2021}
*{box-sizing:border-box;margin:0;padding:0;border:0;border-radius:0}
html,body{width:1280px;height:640px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(235,219,178,.12) 1.1px,transparent 1.3px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse at center,#000 0%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 0%,transparent 72%)}
.glow{position:absolute;width:900px;height:360px;background:radial-gradient(ellipse,rgba(184,187,38,.11),transparent 65%);top:150px}
.brand{position:relative;z-index:2;display:flex;align-items:center;gap:16px;font-size:30px;font-weight:600;letter-spacing:-.025em}
.brand i{width:22px;height:22px;background:var(--green);display:block}
h1{position:relative;z-index:2;margin-top:28px;font-size:104px;line-height:.92;letter-spacing:-.06em;font-weight:600}
h1 span{display:block}
h1 .g{color:var(--green)}
p{position:relative;z-index:2;margin-top:22px;font-size:28px;color:var(--dim);font-weight:400}
p b{color:var(--fg);font-weight:500}
.pills{position:relative;z-index:2;display:flex;gap:12px;margin-top:30px;font-family:"Geist Mono",monospace;font-size:17px}
.pills span{padding:9px 14px;background:var(--soft);color:var(--dim)}
.pills span:first-child{background:var(--green);color:var(--on);font-weight:600}
.url{position:absolute;left:0;right:0;bottom:30px;font-family:"Geist Mono",monospace;font-size:18px;color:var(--faint);letter-spacing:.03em;z-index:2}
</style>
</head>
<body>
<div class="dots"></div><div class="glow"></div>
<div class="brand"><i></i>Leader</div>
<h1><span>Neovim,</span><span class="g">for working.</span></h1>
<p><b>Fast. Minimal. Opinionated.</b> A config and a GPU window for people who live in the editor.</p>
<div class="pills"><span>~20 ms</span><span>GPU window</span><span>AI agent</span><span>MIT</span></div>
<div class="url">leader.sazardev.stream</div>
</body>
</html>
